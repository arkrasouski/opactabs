pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        maven {
            name = "Architectury"
            url = uri("https://maven.architectury.dev/")
        }
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'

}
include ':ftb-teams'
project(':ftb-teams').projectDir = file('libs/FTB-Teams')
rootProject.name = 'customwars'
